# .github/release.yml
changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - wontfix
      - invalid

  categories:
    - title: "🚨 Breaking Changes"
      labels:
        - "Semver-Major"
        - "breaking-change"

    - title: "🎉 New Features"
      labels:
        - "Semver-Minor"
        - "enhancement"
        - "feature"

    - title: "🐛 Bug Fixes"
      labels:
        - "Semver-Patch"
        - "bug"
        - "fix"

    - title: "📡 Signal Bot API"
      labels:
        - "api"
        - "messaging"
        - "groups"
        - "contacts"
        - "websocket"

    - title: "📝 Documentation"
      labels:
        - "documentation"
        - "docs"
        - "examples"

    - title: "📦 Dependencies"
      labels:
        - "dependencies"
        - "nuget"

    - title: "🔄 CI/CD & Build"
      labels:
        - "github-actions"
        - "build"
        - "ci"

    - title: "🔧 Other Changes"
      labels:
        - "*"